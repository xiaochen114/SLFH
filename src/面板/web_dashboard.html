<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中央大脑 · 多机器人调度系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif;
       background:#edeff2;color:#1e2024;min-height:100vh}

  .header{background:#1e2024;padding:0 32px;height:56px;
          display:flex;align-items:center;position:sticky;top:0;z-index:100}
  .header h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:1px}
  .header h1 small{color:#6b7280;font-weight:400;margin-left:12px;font-size:11px}
  .header .status-badge{margin-left:auto;display:flex;align-items:center;gap:8px}
  .header .status-badge .dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
  .header .status-badge span{color:#9ca3af;font-size:12px}
  .header .llm-badge{background:#fffbeb;color:#d97706;border:1px solid #fcd34d;
                     padding:2px 10px;border-radius:4px;font-size:11px;font-weight:600}

  .tabs{display:flex;padding:0 32px;background:#edeff2;border-bottom:1px solid #d4d7dd}
  .tab{padding:12px 24px;cursor:pointer;font-size:13px;color:#6b7280;
       border-bottom:2px solid transparent;transition:all .2s;user-select:none}
  .tab:hover{color:#1e2024}
  .tab.active{color:#1e2024;border-bottom-color:#2563eb;font-weight:600}

  .content{display:none;padding:20px 32px 32px}
  .content.active{display:block}
  .page-section{background:#fff;border-radius:8px;padding:20px;margin-bottom:16px;border:1px solid #e4e6ea}
  .page-section h3{font-size:12px;color:#6b7280;margin-bottom:14px;font-weight:500}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .stat-card{background:#fff;border-radius:8px;padding:20px;border:1px solid #e4e6ea}
  .stat-card .num{font-size:28px;font-weight:700;color:#1e2024;line-height:1.2;font-variant-numeric:tabular-nums}
  .stat-card .lbl{font-size:11px;color:#9ca3af;margin-top:4px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .card{background:#fff;border-radius:8px;padding:16px 20px;border:1px solid #e4e6ea;transition:border-color .2s}
  .card:hover{border-color:#9ca3af}
  .card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #f0f2f5}
  .card .card-header h3{font-size:14px;font-weight:600;color:#1e2024;margin-bottom:0}
  .card .card-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
  .card .card-body .row{font-size:12px;display:flex;justify-content:space-between;padding:3px 0}
  .card .card-body .row .label{color:#9ca3af}
  .card .card-body .row .val{font-weight:500;color:#1e2024;font-variant-numeric:tabular-nums}
  .card .card-footer{display:flex;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid #f0f2f5;flex-wrap:wrap}

  .tag{display:inline-flex;padding:1px 8px;border-radius:3px;font-size:10px;font-weight:600}
  .tag-dog{background:#dcfce7;color:#15803d}
  .tag-drone{background:#dbeafe;color:#1d4ed8}
  .status-ok{color:#15803d}
  .status-warning{color:#d97706}
  .status-error{color:#dc2626}

  .btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;
       border-radius:4px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit}
  .btn-default{background:#f0f2f5;color:#4b5563}.btn-default:hover{background:#e4e6ea}
  .btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
  .btn-success{background:#15803d;color:#fff}.btn-success:hover{background:#166534}
  .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
  .btn-sm{padding:4px 10px;font-size:10px}

  .bat-bar{height:4px;background:#f0f2f5;display:inline-block;width:50px;vertical-align:middle}
  .bat-fill{height:100%;transition:width .5s}

  .alert-list{border:1px solid #e4e6ea;border-radius:6px;overflow:hidden}
  .alert-item{padding:10px 14px;border-bottom:1px solid #f0f2f5;font-size:12px;
              display:flex;gap:10px;align-items:start;background:#fff}
  .alert-item:last-child{border:none}
  .alert-item .time{color:#9ca3af;white-space:nowrap;min-width:52px;font-size:11px;font-variant-numeric:tabular-nums}
  .alert-item .level-tag{font-size:10px;padding:1px 6px;border-radius:2px;font-weight:600}
  .alert-error .level-tag{background:#fef2f2;color:#dc2626}
  .alert-warning .level-tag{background:#fffbeb;color:#d97706}
  .alert-info .level-tag{background:#eff6ff;color:#2563eb}
  .alert-error{border-left:3px solid #dc2626}
  .alert-warning{border-left:3px solid #d97706}
  .alert-info{border-left:3px solid #2563eb}

  input{padding:7px 10px;border:1px solid #d4d7dd;border-radius:4px;font-size:12px;
        color:#1e2024;outline:none;transition:border-color .15s;font-family:inherit;background:#fff}
  input:focus{border-color:#2563eb}
  input::placeholder{color:#b0b6c4}

  .patrol-controls{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .patrol-controls input{width:80px}
  .patrol-list{border:1px solid #e4e6ea;border-radius:6px;overflow:hidden}
  .patrol-item{padding:10px 14px;border-bottom:1px solid #f0f2f5;display:flex;
               justify-content:space-between;align-items:center;font-size:12px;background:#fff}
  .patrol-item:last-child{border:none}
  .patrol-item .pt-name{font-weight:600;margin-right:8px;color:#1e2024}

  .hist-table{width:100%;border-collapse:collapse;font-size:12px}
  .hist-table th{padding:8px 12px;text-align:left;color:#9ca3af;border-bottom:2px solid #e4e6ea;font-weight:500;white-space:nowrap;font-size:11px}
  .hist-table td{padding:7px 12px;border-bottom:1px solid #f0f2f5;color:#4b5563;font-variant-numeric:tabular-nums}
  .hist-table tbody tr:hover td{background:#f8f9fb}
  .table-wrap{overflow-x:auto;border:1px solid #e4e6ea;border-radius:6px}

  .log-box{background:#f8f9fb;border:1px solid #e4e6ea;border-radius:6px;padding:12px;
           font-family:'Consolas','Courier New',monospace;font-size:11px;max-height:240px;overflow-y:auto;line-height:1.6;color:#6b7280}

  .empty{padding:40px 20px;text-align:center;color:#b0b6c4;font-size:12px}

  .hist-switch{display:flex;gap:4px;margin-bottom:12px}
  .hist-switch .btn{background:#f0f2f5;color:#6b7280}
  .hist-switch .btn.active{background:#2563eb;color:#fff}

  @media(max-width:700px){
    .header{padding:0 16px}
    .header h1{font-size:13px}
    .header h1 small{display:none}
    .tabs{padding:0 16px}
    .tab{padding:10px 14px;font-size:12px}
    .content{padding:14px 16px 24px}
    .stats{grid-template-columns:repeat(2,1fr);gap:8px}
    .stat-card{padding:14px}
    .stat-card .num{font-size:22px}
    .grid{grid-template-columns:1fr}
    .page-section{padding:14px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>中央大脑 <small>· 多机器人调度系统</small></h1>
  <div class="status-badge">
    <span class="llm-badge" id="llmBadge" style="display:none">⚠ LLM 降级中</span>
    <span class="dot"></span>
    <span id="headerStatus">连接中...</span>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('command')" id="tab_command">指挥台</div>
  <div class="tab" onclick="switchTab('dashboard')" id="tab_dashboard">总览</div>
  <div class="tab" onclick="switchTab('robots')" id="tab_robots">机器人</div>
  <div class="tab" onclick="switchTab('patrol')" id="tab_patrol">巡逻</div>
  <div class="tab" onclick="switchTab('history')" id="tab_history">日志</div>
</div>

<!-- ======================== 指挥台 ======================== -->
<div class="content active" id="page_command">
  <!-- LLM 状态卡 -->
  <div class="stats" id="llmStatsBar"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start">
    <!-- 实时流水 -->
    <div class="page-section">
      <h3>调度流水 <span class="badge" id="flowBadge">LIVE</span></h3>
      <div class="log-box" id="flowLog" style="max-height:320px"><div class="empty">等待调度事件...</div></div>
    </div>

    <!-- 对话窗口 -->
    <div class="page-section">
      <h3>操作员 ↔ LLM</h3>
      <div class="log-box" id="chatLog" style="max-height:240px;margin-bottom:10px"><div class="empty">开始对话...</div></div>
      <div class="patrol-controls">
        <input id="chatInput" placeholder="对 LLM 下达指令或提问..." style="flex:1;width:auto;min-width:200px"
               onkeydown="if(event.key==='Enter')chatSend()">
        <button class="btn btn-primary btn-sm" onclick="chatSend()">发送</button>
      </div>
    </div>
  </div>

  <!-- 待确认指令 -->
  <div class="page-section">
    <h3>待确认指令 <span class="badge" id="pendingBadge">0</span></h3>
    <div class="patrol-list" id="pendingList"><div class="empty">暂无待确认指令</div></div>
  </div>

  <!-- 人工干预操作区 -->
  <div class="page-section">
    <h3>人工干预 <span class="badge">操作员</span></h3>
    <div class="patrol-controls">
      <input id="opRobot" placeholder="机器人ID" style="width:120px">
      <select id="opCommand" style="padding:7px 10px;border:1px solid #d4d7dd;border-radius:4px;font-size:12px">
        <option value="stand">起立</option>
        <option value="patrol">巡逻</option>
        <option value="stop">停止</option>
        <option value="return">返航</option>
        <option value="alert" style="color:#dc2626">急停</option>
      </select>
      <input id="opReason" placeholder="原因(可选)" style="flex:1;min-width:150px">
      <button class="btn btn-success btn-sm" onclick="intervene()">下发</button>
    </div>
  </div>
</div>

<div class="content" id="page_dashboard">
  <div class="stats" id="statsBar"></div>
  <div class="page-section">
    <h3>告警消息</h3>
    <div class="alert-list" id="alertFeed"><div class="empty">暂无告警</div></div>
  </div>
  <div class="page-section">
    <h3>在线机器人</h3>
    <div class="grid" id="robotGrid"></div>
  </div>
</div>

<div class="content" id="page_robots">
  <div class="page-section">
    <h3>全部机器人 <span id="robotCountBadge" style="color:#9ca3af;margin-left:6px">· 0</span></h3>
    <div class="grid" id="robotGridFull"></div>
  </div>
</div>

<div class="content" id="page_patrol">
  <div class="page-section">
    <h3>巡逻控制 <span id="patrolStatus" style="font-weight:400;color:#9ca3af;margin-left:8px">(空闲)</span></h3>
    <div class="patrol-controls">
      <button class="btn btn-success" onclick="patrolStart()">开始巡逻</button>
      <button class="btn btn-danger" onclick="patrolStop()">停止巡逻</button>
    </div>
  </div>
  <div class="page-section">
    <h3>巡逻点管理</h3>
    <div class="patrol-controls">
      <input id="ptName" placeholder="名称" style="width:90px">
      <input id="ptX" placeholder="X坐标" type="number" step="0.1" style="width:70px">
      <input id="ptY" placeholder="Y坐标" type="number" step="0.1" style="width:70px">
      <input id="ptYaw" placeholder="朝向" type="number" step="0.1" value="0" style="width:70px">
      <button class="btn btn-primary" onclick="patrolAdd()">添加</button>
    </div>
    <div class="patrol-list" id="patrolList"><div class="empty">暂无巡逻点</div></div>
  </div>
  <div class="page-section">
    <h3>巡逻日志</h3>
    <div class="log-box" id="patrolLog"><div class="empty">-</div></div>
  </div>
</div>

<div class="content" id="page_history">
  <div class="page-section">
    <h3>系统日志</h3>
    <div class="hist-switch">
      <button class="btn active" id="histTabTasks" onclick="loadHistory('tasks')">任务记录</button>
      <button class="btn" id="histTabRobots" onclick="loadHistory('robots')">状态历史</button>
    </div>
    <div class="table-wrap">
      <table class="hist-table" id="histTable">
        <thead><tr><th>时间</th><th>机器人</th><th>类型</th><th>详情</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
function $(id){return document.getElementById(id)}
async function api(path, opts){
  const r = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  return r.json();
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  $('tab_'+name).classList.add('active');
  $('page_'+name).classList.add('active');
  if(name==='command') loadCommand();
  if(name==='robots') loadRobots();
  if(name==='patrol') loadPatrol();
  if(name==='history') loadHistory('tasks');
}

// ======================== 指挥台 ========================
async function loadCommand(){
  loadLLMStats();
  loadChatHistory();
  loadPending();
  loadFlow();
}

async function loadLLMStats(){
  try {
    const r = await api('/llm/status');
    const st = r.data||{};
    const badge = $('llmBadge');
    if(st.降级中 || st.mode==='rule'){ badge.style.display='inline'; badge.textContent='LLM 降级中'; }
    else { badge.style.display='none'; }
    $('llmStatsBar').innerHTML =
      '<div class="stat-card"><div class="num">'+(st.mode==='llm'?'在线':'降级')+'</div><div class="lbl">LLM 状态</div></div>'+
      '<div class="stat-card"><div class="num">'+ (st.连续失败||0) +'</div><div class="lbl">连续失败</div></div>'+
      '<div class="stat-card"><div class="num">'+ (st.最后成功?new Date(st.最后成功*1000).toLocaleTimeString():'-') +'</div><div class="lbl">最后成功</div></div>'+
      (st.最后错误?'<div class="stat-card"><div class="num" style="font-size:14px;color:#dc2626">ERR</div><div class="lbl">'+(st.最后错误+'').slice(0,20)+'</div></div>':'');
  }catch(e){}
}

async function loadFlow(){
  try {
    const r = await api('/llm/history');
    const rows = (r.data||[]).slice(0,20).reverse();  // 时间正序
    const box = $('flowLog');
    if(!rows.length){ box.innerHTML='<div class="empty">等待调度事件...</div>'; return; }
    box.innerHTML = rows.map(d=>{
      const t = new Date(d.created_at*1000).toLocaleTimeString();
      const mode = d.mode==='llm'?'LLM':'规则';
      const evs = (d.events_json||[]).map(e=>e.label||e.type||'?').join(',')||'无事件';
      const ods = (d.orders_json||[]).map(o=>o.type+'→'+o.robot_id).join(',')||'无指令';
      const ms = d.latency_ms||0;
      return '<div class="line">['+t+'] ['+mode+'] '+evs+' → '+ods+' ('+ms+'ms)</div>';
    }).join('');
  }catch(e){ box.innerHTML='<div class="empty">加载失败</div>'; }
}

async function loadChatHistory(){
  try {
    const r = await api('/chat/history');
    const rows = r.data||[];
    const box = $('chatLog');
    if(!rows.length){ box.innerHTML='<div class="empty">开始对话...</div>'; return; }
    box.innerHTML = rows.map(d=>{
      const who = d.role==='operator'?'操作员':'LLM';
      return '<div class="line"><b>'+who+'</b>: '+d.content+'</div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
  }catch(e){}
}

async function loadPending(){
  try {
    const r = await api('/orders/pending');
    const rows = r.data||[];
    $('pendingBadge').textContent = rows.length;
    const box = $('pendingList');
    if(!rows.length){ box.innerHTML='<div class="empty">暂无待确认指令</div>'; return; }
    box.innerHTML = rows.map(p=>{
      const o = p.order_json||{};
      return '<div class="patrol-item">'+
        '<span><b>'+o.type+'</b> → '+p.robot_id+' <span class="tag tag-dog">'+(p.source==='operator'?'操作员':'LLM')+'</span></span>'+
        '<span style="display:flex;gap:4px">'+
        '<button class="btn btn-success btn-sm" onclick="pendingAction('+p.id+',\'confirm\')">执行</button>'+
        '<button class="btn btn-danger btn-sm" onclick="pendingAction('+p.id+',\'reject\')">拒绝</button>'+
        '</span></div>';
    }).join('');
  }catch(e){}
}

async function pendingAction(id, action){
  await api('/orders/confirm', {method:'POST', body:JSON.stringify({id, action})});
  loadPending();
}

async function chatSend(){
  const input = $('chatInput');
  const content = input.value.trim();
  if(!content) return;
  input.value='';
  // 显示操作员消息
  $('chatLog').innerHTML += '<div class="line"><b>操作员</b>: '+content+'</div>';
  try {
    const r = await api('/chat/send', {method:'POST', body:JSON.stringify({content})});
    if(r.code===200){
      $('chatLog').innerHTML += '<div class="line"><b>LLM</b>: '+(r.data?.reply||'')+'</div>';
      if(r.data?.orders?.length){
        $('chatLog').innerHTML += '<div class="line" style="color:#2563eb">↳ 生成 '+r.data.orders.length+' 条待确认指令</div>';
      }
    } else {
      $('chatLog').innerHTML += '<div class="line" style="color:#dc2626">错误: '+(r.message||'')+'</div>';
    }
  }catch(e){
    $('chatLog').innerHTML += '<div class="line" style="color:#dc2626">连接失败</div>';
  }
  $('chatLog').scrollTop = $('chatLog').scrollHeight;
  loadPending();
}

async function intervene(){
  const robotId = $('opRobot').value.trim();
  const cmd = $('opCommand').value;
  const reason = $('opReason').value.trim();
  if(!robotId){ alert('请输入机器人ID'); return; }
  // 高危命令二次确认
  if(cmd==='alert'){
    if(!confirm('确认对 '+robotId+' 执行急停？')) return;
  }
  const r = await api('/orders/intervene', {method:'POST', body:JSON.stringify({robot_id:robotId, command:cmd, reason})});
  if(r.code===200){ $('opReason').value=''; addAlert({level:'info',message:'人工下发 '+cmd+' → '+robotId,time:Date.now()/1000}); }
  else { alert('下发失败: '+(r.message||'')); }
}


const evtSource = new EventSource(API + '/events');
const _seen = new Set();

evtSource.onmessage = function(e){
  try {
    const ev = JSON.parse(e.data);
    if(ev.type==='alert') addAlert(ev.data);
    if(ev.type==='system_health') updateStats(ev.data);
    if(ev.type==='llm_decision'){ loadFlow(); loadLLMStats(); }
  } catch(ex) {}
};

function addAlert(a){
  const key=(a.level||'')+'|'+(a.message||a.type||'');
  if(_seen.has(key)) return;
  _seen.add(key);
  const feed=$('alertFeed');
  const empty=feed.querySelector('.empty');
  if(empty) feed.innerHTML='';
  const levelLabel={error:'错误',warning:'警告',info:'信息'};
  const el=document.createElement('div');
  el.className='alert-item alert-'+(a.level||'info');
  const t=new Date((a.time||0)*1000);
  el.innerHTML='<span class="level-tag">'+(levelLabel[a.level]||'信息')+'</span><span class="time">'+t.toLocaleTimeString()+'</span><span>'+(a.message||a.type||'')+'</span>';
  feed.appendChild(el);
}

function formatUptime(s){
  if(s>86400) return Math.floor(s/86400)+'天 '+Math.floor((s%86400)/3600)+'小时';
  if(s>3600) return Math.floor(s/3600)+'小时 '+Math.floor((s%3600)/60)+'分';
  return Math.floor(s/60)+'分钟';
}

function updateStats(data){
  $('headerStatus').textContent = data.robot_count+' 台设备 · '+data.online+' 在线';
  $('statsBar').innerHTML =
    '<div class="stat-card"><div class="num">'+data.robot_count+'</div><div class="lbl">设备总数</div></div>'+
    '<div class="stat-card"><div class="num">'+data.online+'</div><div class="lbl">在线</div></div>'+
    '<div class="stat-card"><div class="num">'+(data.robot_count-data.online)+'</div><div class="lbl">离线</div></div>'+
    '<div class="stat-card"><div class="num">'+formatUptime(data.uptime)+'</div><div class="lbl">运行时长</div></div>';
}

async function loadDashboard(){
  try {
    const data=await api('/status');
    const t=data.data||{};
    $('headerStatus').textContent=(t.total||0)+' 台设备 · '+(t.online||0)+' 在线';
    $('statsBar').innerHTML =
      '<div class="stat-card"><div class="num">'+(t.total||0)+'</div><div class="lbl">设备总数</div></div>'+
      '<div class="stat-card"><div class="num">'+(t.online||0)+'</div><div class="lbl">在线</div></div>'+
      '<div class="stat-card"><div class="num">'+((t.total||0)-(t.online||0))+'</div><div class="lbl">离线</div></div>';
    renderCards((data.data?.robots)||[]);
  } catch(e){$('headerStatus').textContent='无法连接';}
}

function renderCards(robots){
  const root=$('robotGrid');
  if(!robots.length){root.innerHTML='<div class="empty">暂无注册机器人</div>';return;}
  root.innerHTML=robots.map(rcard).join('');
}

function rcard(r){
  const tag=r.type==='dog'?'<span class="tag tag-dog">机器狗</span>':r.type==='drone'?'<span class="tag tag-drone">无人机</span>':'';
  const pct=Math.round((r.battery||0)*100);
  const bc=pct>50?'#15803d':pct>20?'#d97706':'#dc2626';
  const hc=(r.health||'ok')==='ok'?'status-ok':(r.health||'')==='warning'?'status-warning':'status-error';
  const healthText={ok:'正常',warning:'异常',error:'故障'};
  return '<div class="card"><div class="card-header"><h3>'+(r.id||'?')+' '+tag+'</h3></div>'+
    '<div class="card-body">'+
    '<div class="row"><span class="label">状态</span><span class="'+hc+'">'+(healthText[r.health]||r.health||'?')+'</span></div>'+
    '<div class="row"><span class="label">模式</span><span>'+(r.mode||'?')+'</span></div>'+
    '<div class="row"><span class="label">电量</span><span>'+pct+'% <span class="bat-bar"><span class="bat-fill" style="width:'+pct+'%;background:'+bc+'"></span></span></span></div>'+
    '<div class="row"><span class="label">通信</span><span>L'+(r.comm_level||'?')+'</span></div>'+
    '</div><div class="card-footer">'+
    '<button class="btn btn-default btn-sm" onclick="sendCmd(\''+r.id+'\',\'stand\')">起立</button>'+
    '<button class="btn btn-default btn-sm" onclick="sendCmd(\''+r.id+'\',\'patrol\')">巡逻</button>'+
    '<button class="btn btn-default btn-sm" onclick="sendCmd(\''+r.id+'\',\'stop\')">停止</button>'+
    '<button class="btn btn-danger btn-sm" onclick="sendCmd(\''+r.id+'\',\'alert\')">急停</button>'+
    '</div></div>';
}

async function sendCmd(id,cmd){
  await api('/command',{method:'POST',body:JSON.stringify({robot_id:id,command:cmd})});
  addAlert({level:'info',message:cmd+' -> '+id,time:Date.now()/1000});
  loadDashboard();
}

async function loadRobots(){
  const root=$('robotGridFull');
  const data=await api('/robots');
  const robots=data.data||[];
  $('robotCountBadge').textContent='· '+robots.length;
  if(!robots.length){root.innerHTML='<div class="empty">暂无注册机器人</div>';return;}
  const full=[];
  for(const r of robots){
    try {
      const rd=await api('/robots/'+r.id);
      const st=rd.data?.status||{};
      full.push({id:r.id,type:st.robot_type||'dog',battery:st.battery,mode:st.mode,health:st.health,comm_level:st.communication_level,position:st.position,capabilities:rd.data?.capabilities||[]});
    }catch(e){full.push({id:r.id,type:'dog'});}
  }
  root.innerHTML=full.map(r=>{
    const html=rcard(r);
    const pos=r.position?'('+(r.position[0]?.toFixed(1)||'?')+', '+(r.position[1]?.toFixed(1)||'?')+')':'未知';
    const caps=(r.capabilities||[]).join(', ');
    return html.replace('</div></div>',
      '<div class="row"><span class="label">坐标</span><span>'+pos+'</span></div>'+(caps?'<div class="row"><span class="label">能力</span><span>'+caps+'</span></div>':'')+
      '</div></div>');
  }).join('');
}

async function loadPatrol(){
  const res=await api('/patrol/status');
  const st=res.data||{};
  $('patrolStatus').textContent=st.patrol_running?'(运行中)':'(空闲)';
  const pts=await api('/patrol/points');
  const list=pts.data||[];
  const c=$('patrolList');
  if(!list.length){c.innerHTML='<div class="empty">暂无巡逻点</div>';return;}
  c.innerHTML='<div style="display:grid;grid-template-columns:40px 1fr 100px 100px;gap:0;font-size:12px;background:#f8f9fb;padding:8px 14px;border-bottom:1px solid #e4e6ea;color:#9ca3af;font-weight:500">'+
    '<span>#</span><span>名称</span><span>X</span><span>Y</span></div>'+
    list.map((p,i)=>
      '<div class="patrol-item" style="display:grid;grid-template-columns:40px 1fr 100px 100px;gap:0;align-items:center">'+
      '<span style="color:#9ca3af">'+(i+1)+'</span>'+
      '<span class="pt-name">'+(p.name||'点'+(i+1))+'</span>'+
      '<span style="font-variant-numeric:tabular-nums">'+p.x+'</span>'+
      '<span style="display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums">'+p.y+
        '<button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="patrolDel('+i+')">删除</button></span></div>'
    ).join('');
}
async function patrolAdd(){
  const n=$('ptName').value,x=parseFloat($('ptX').value),y=parseFloat($('ptY').value),yaw=parseFloat($('ptYaw').value)||0;
  if(isNaN(x)||isNaN(y)){alert('请填写 X 和 Y 坐标');return;}
  const res=await api('/patrol/points',{method:'POST',body:JSON.stringify({x,y,yaw,name:n})});
  if(res.code===200){
    $('ptName').value='';$('ptX').value='';$('ptY').value='';
    loadPatrol();
  }else{
    alert('添加失败: '+(res.message||'未知错误'));
  }
}
async function patrolDel(i){
  const res=await api('/patrol/points/'+i,{method:'DELETE'});
  if(res.code===200){loadPatrol();}else{alert('删除失败');}
}
async function patrolStart(){
  const res=await api('/patrol/start',{method:'POST'});
  if(res.code===200){loadPatrol();addAlert({level:'info',message:'巡逻已启动',time:Date.now()/1000});}else{alert('启动失败: '+(res.message||''));}
}
async function patrolStop(){
  const res=await api('/patrol/stop',{method:'POST'});
  if(res.code===200){loadPatrol();addAlert({level:'info',message:'巡逻已停止',time:Date.now()/1000});}else{alert('停止失败: '+(res.message||''));}
}

async function loadHistory(type){
  $('histTabTasks').className='btn'+(type==='tasks'?' active':'');
  $('histTabRobots').className='btn'+(type==='robots'?' active':'');
  const tbody=$('histBody');
  try {
    const data=type==='tasks'?await api('/history/tasks?limit=100'):await api('/history/robots?limit=100');
    const rows=data.data||[];
    if(type==='tasks'){
      $('histTable').querySelector('thead tr').innerHTML='<th>时间</th><th>机器人</th><th>类型</th><th>来源</th><th>结果</th>';
      tbody.innerHTML=rows.map(r=>'<tr><td>'+new Date((r.created_at||0)*1000).toLocaleString()+'</td><td>'+(r.robot_id||'')+'</td><td>'+(r.type||'')+'</td><td>'+(r.source||'')+'</td><td>'+(r.success?'成功':'失败')+' '+(r.message||'')+'</td></tr>').join('')||'<tr><td colspan="5"><div class="empty">-</div></td></tr>';
    }else{
      $('histTable').querySelector('thead tr').innerHTML='<th>时间</th><th>机器人</th><th>类型</th><th>电量</th><th>模式</th><th>健康</th>';
      tbody.innerHTML=rows.map(r=>'<tr><td>'+new Date((r.timestamp||0)*1000).toLocaleString()+'</td><td>'+(r.robot_id||'')+'</td><td>'+(r.robot_type||'')+'</td><td>'+Math.round((r.battery||0)*100)+'%</td><td>'+(r.mode||'')+'</td><td>'+(r.health||'')+'</td></tr>').join('')||'<tr><td colspan="6"><div class="empty">-</div></td></tr>';
    }
  }catch(e){tbody.innerHTML='<tr><td colspan="5"><div class="empty">加载失败</div></td></tr>';}
}

loadDashboard();
setInterval(()=>{
  const a=document.querySelector('.content.active');
  if(a&&a.id==='page_dashboard') loadDashboard();
  if(a&&a.id==='page_command'){ loadFlow(); loadPending(); loadLLMStats(); }
},3000);

// ======================== LLM 状态轮询 ========================
async function checkLLMStatus(){
  try {
    const r = await api('/llm/status');
    const st = r.data || {};
    const badge = $('llmBadge');
    if(st.降级中 || st.mode === 'rule'){
      badge.style.display = 'inline';
      badge.textContent = '⚠ LLM 降级中' + (st.最后错误 ? ' · ' + (st.最后错误+'').slice(0,40) : '');
    }else{
      badge.style.display = 'none';
    }
  }catch(e){}
}
checkLLMStatus();
setInterval(checkLLMStatus, 10000);
