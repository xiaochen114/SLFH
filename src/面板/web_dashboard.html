<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中央大脑 · 多机器人调度系统</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Microsoft YaHei','Segoe UI',sans-serif}
  body{background:#0d1117;color:#c9d1d9;min-height:100vh}
  /* Header */
  .header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
  .header h1{font-size:18px;font-weight:600;color:#f0f6fc}
  .header h1 span{color:#58a6ff}
  .header .sub{font-size:12px;color:#8b949e;margin-left:auto}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .status-dot.online{background:#3fb950}
  .status-dot.offline{background:#f85149}
  /* Tabs */
  .tabs{display:flex;gap:0;background:#161b22;border-bottom:1px solid #30363d;padding:0 24px}
  .tab{padding:10px 20px;cursor:pointer;font-size:13px;color:#8b949e;border-bottom:2px solid transparent;transition:all .2s}
  .tab:hover{color:#c9d1d9}
  .tab.active{color:#f0f6fc;border-bottom-color:#58a6ff}
  /* Content */
  .content{display:none;padding:20px 24px}
  .content.active{display:block}
  /* Cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;transition:border-color .2s}
  .card:hover{border-color:#58a6ff}
  .card h3{font-size:14px;color:#f0f6fc;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .card .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid #21262d}
  .card .row:last-child{border:none}
  .card .label{color:#8b949e}
  .card .val{font-weight:500}
  /* Stats bar */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .stat-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;text-align:center}
  .stat-card .num{font-size:28px;font-weight:600;color:#f0f6fc}
  .stat-card .lbl{font-size:11px;color:#8b949e;margin-top:4px}
  /* Alerts */
  .alert-list{background:#161b22;border:1px solid #30363d;border-radius:8px;max-height:400px;overflow-y:auto}
  .alert-item{padding:8px 12px;border-bottom:1px solid #21262d;font-size:12px;display:flex;gap:8px;align-items:start}
  .alert-item:last-child{border:none}
  .alert-item .time{color:#8b949e;white-space:nowrap;min-width:60px}
  .alert-error{border-left:3px solid #f85149}
  .alert-warning{border-left:3px solid #d29922}
  .alert-info{border-left:3px solid #58a6ff}
  /* Tags */
  .tag{display:inline-block;padding:1px 8px;border-radius:12px;font-size:10px;font-weight:600}
  .tag-dog{background:#1b5e20;color:#7ee787}
  .tag-drone{background:#0d419d;color:#79c0ff}
  .tag-ok{color:#3fb950}
  .tag-warn{color:#d29922}
  .tag-err{color:#f85149}
  /* Buttons */
  .btn{padding:6px 14px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:12px;transition:all .15s}
  .btn:hover{background:#30363d;border-color:#8b949e}
  .btn-primary{background:#238636;border-color:#238636;color:#fff}
  .btn-primary:hover{background:#2ea043}
  .btn-danger{background:#da3633;border-color:#da3633;color:#fff}
  .btn-danger:hover{background:#f85149}
  .btn-sm{padding:3px 10px;font-size:11px}
  .cmd-group{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  /* Battery bar */
  .bat-bar{height:4px;background:#21262d;border-radius:2px;overflow:hidden;display:inline-block;width:60px;vertical-align:middle}
  .bat-fill{height:100%;border-radius:2px;transition:width .5s}
  /* Patrol */
  .patrol-controls{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .patrol-controls input{padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:12px;width:80px}
  .patrol-controls input:focus{outline:none;border-color:#58a6ff}
  .patrol-list{background:#161b22;border:1px solid #30363d;border-radius:8px}
  .patrol-item{padding:8px 12px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center;font-size:12px}
  .patrol-item:last-child{border:none}
  /* History table */
  .hist-table{width:100%;border-collapse:collapse;font-size:12px}
  .hist-table th{padding:8px 10px;text-align:left;color:#8b949e;border-bottom:1px solid #30363d;font-weight:500}
  .hist-table td{padding:6px 10px;border-bottom:1px solid #21262d}
  .hist-table tr:hover td{background:#1c2128}
  /* Empty state */
  .empty{padding:40px;text-align:center;color:#8b949e;font-size:13px}
  /* Log viewer */
  .log-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;font-family:'Consolas','Courier New',monospace;font-size:11px;max-height:300px;overflow-y:auto;line-height:1.6}
  .log-box .line{color:#8b949e}
  .log-box .line:nth-child(odd){background:#161b22}
  /* Video */
  .video-feed{width:100%;max-height:160px;object-fit:cover;border-radius:6px;background:#0d1117;margin-bottom:8px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>&#9881; <span>中央大脑</span> · 异构多机器人调度系统</h1>
  <div class="sub"><span class="status-dot online" id="statusDot"></span><span id="headerStatus">连接中...</span></div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')" id="tab_dashboard">&#9632; 仪表盘</div>
  <div class="tab" onclick="switchTab('robots')" id="tab_robots">&#9881; 机器人</div>
  <div class="tab" onclick="switchTab('patrol')" id="tab_patrol">&#9654; 巡逻</div>
  <div class="tab" onclick="switchTab('history')" id="tab_history">&#9776; 历史</div>
</div>

<!-- ============================== Dashboard ============================== -->
<div class="content active" id="page_dashboard">
  <div class="stats" id="statsBar"></div>
  <h3 style="font-size:13px;color:#8b949e;margin-bottom:8px">&#9888; 实时告警</h3>
  <div class="alert-list" id="alertFeed"><div class="empty">等待告警...</div></div>
  <h3 style="font-size:13px;color:#8b949e;margin:12px 0 8px">&#128062; 机器人概览</h3>
  <div class="grid" id="robotGrid"></div>
</div>

<!-- ============================== Robots ============================== -->
<div class="content" id="page_robots">
  <div class="grid" id="robotGridFull"></div>
</div>

<!-- ============================== Patrol ============================== -->
<div class="content" id="page_patrol">
  <h3 style="font-size:13px;color:#8b949e;margin-bottom:8px">&#9654; 巡逻控制</h3>
  <div class="patrol-controls">
    <button class="btn btn-primary btn-sm" onclick="patrolStart()">&#9654; 开始</button>
    <button class="btn btn-danger btn-sm" onclick="patrolStop()">&#9632; 停止</button>
    <span style="color:#8b949e;font-size:12px" id="patrolStatus">空闲</span>
  </div>
  <h3 style="font-size:13px;color:#8b949e;margin:12px 0 8px">&#10133; 添加巡逻点</h3>
  <div class="patrol-controls">
    <input id="ptName" placeholder="名称">
    <input id="ptX" placeholder="X坐标" type="number" step="0.1">
    <input id="ptY" placeholder="Y坐标" type="number" step="0.1">
    <input id="ptYaw" placeholder="朝向" type="number" step="0.1" value="0">
    <button class="btn btn-primary btn-sm" onclick="patrolAdd()">&#10133; 添加</button>
  </div>
  <div class="patrol-list" id="patrolList"><div class="empty">无巡逻点，请添加</div></div>
  <h3 style="font-size:13px;color:#8b949e;margin:12px 0 8px">&#128196; 巡逻日志</h3>
  <div class="log-box" id="patrolLog"><div class="empty">暂无日志</div></div>
</div>

<!-- ============================== History ============================== -->
<div class="content" id="page_history">
  <div class="stats" id="histStatsBar"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px">
    <button class="tab-link btn btn-sm" onclick="loadHistory('tasks')" style="background:#238636;color:#fff;border:none">任务日志</button>
    <button class="tab-link btn btn-sm" onclick="loadHistory('robots')">状态历史</button>
  </div>
  <div style="overflow-x:auto">
    <table class="hist-table" id="histTable">
      <thead><tr><th>时间</th><th>机器人</th><th>类型</th><th>详情</th></tr></thead>
      <tbody id="histBody"></tbody>
    </table>
  </div>
</div>

<script>
// ======================== 工具函数 ========================
const API = '/api/v1';

function $(id){return document.getElementById(id)}

async function api(path, opts){
  const r = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  return r.json();
}

// ======================== Tab 切换 ========================
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  $('tab_' + name).classList.add('active');
  $('page_' + name).classList.add('active');
  if(name === 'robots') loadRobots();
  if(name === 'patrol') loadPatrol();
  if(name === 'history') loadHistory('tasks');
}

// ======================== SSE 实时事件 ========================
const evtSource = new EventSource(API + '/events');
evtSource.onmessage = function(e){
  try {
    const ev = JSON.parse(e.data);
    if(ev.type === 'robot_heartbeat') { /* handled by polling */ }
    if(ev.type === 'alert') addAlert(ev.data);
    if(ev.type === 'system_health') updateStats(ev.data);
  } catch(ex) {}
};

// ======================== 仪表盘 ========================
function updateStats(data){
  $('headerStatus').textContent = data.robot_count + ' 台 · ' + data.online + ' 在线';
  $('statsBar').innerHTML = [
    '<div class="stat-card"><div class="num">' + data.robot_count + '</div><div class="lbl">机器人总数</div></div>',
    '<div class="stat-card"><div class="num">' + data.online + '</div><div class="lbl">在线</div></div>',
    '<div class="stat-card"><div class="num">' + (data.robot_count - data.online) + '</div><div class="lbl">离线</div></div>',
    '<div class="stat-card"><div class="num">' + Math.floor(data.uptime / 60) + 'm</div><div class="lbl">运行时长</div></div>',
  ].join('');
}

function addAlert(alert){
  const feed = $('alertFeed');
  const empty = feed.querySelector('.empty');
  if(empty) feed.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'alert-item alert-' + (alert.level || 'info');
  const t = new Date((alert.time || 0)*1000);
  el.innerHTML = '<span class="time">' + t.toLocaleTimeString() + '</span><span>' + (alert.message || alert.type) + '</span>';
  feed.insertBefore(el, feed.firstChild);
  while(feed.children.length > 50) feed.removeChild(feed.lastChild);
}

let robotCache = [];

async function loadDashboard(){
  try {
    const data = await api('/status');
    robotCache = data.data?.robots || [];

    // Stats
    const totals = data.data || {};
    $('statsBar').innerHTML = [
      '<div class="stat-card"><div class="num">' + (totals.total||0) + '</div><div class="lbl">机器人总数</div></div>',
      '<div class="stat-card"><div class="num">' + (totals.online||0) + '</div><div class="lbl">在线</div></div>',
      '<div class="stat-card"><div class="num">' + ((totals.total||0)-(totals.online||0)) + '</div><div class="lbl">离线</div></div>',
    ].join('');
    $('headerStatus').textContent = (totals.total||0) + ' 台 · ' + (totals.online||0) + ' 在线';

    renderRobotCards(robotCache);
  } catch(e) { $('headerStatus').textContent = '无法连接'; }
}

function renderRobotCards(robots){
  const root = $('robotGrid');
  if(!robots || !robots.length){ root.innerHTML = '<div class="empty">暂无注册机器人</div>'; return; }
  root.innerHTML = robots.map(r => robotCardHTML(r)).join('');
}

function robotCardHTML(r){
  const tag = r.type === 'dog' ? '<span class="tag tag-dog">机器狗</span>' : r.type === 'drone' ? '<span class="tag tag-drone">无人机</span>' : '';
  const batPct = Math.round((r.battery||0) * 100);
  const batCol = batPct > 50 ? '#3fb950' : batPct > 20 ? '#d29922' : '#f85149';
  const hlClass = (r.health||'ok') === 'ok' ? 'tag-ok' : (r.health||'') === 'warning' ? 'tag-warn' : 'tag-err';
  return '<div class="card">' +
    '<h3>' + (r.id||'?') + ' ' + tag + '</h3>' +
    '<div class="row"><span class="label">状态</span><span class="' + hlClass + '">' + (r.health||'?') + '</span></div>' +
    '<div class="row"><span class="label">模式</span><span>' + (r.mode||'?') + '</span></div>' +
    '<div class="row"><span class="label">电量</span><span>' + batPct + '% <span class="bat-bar"><span class="bat-fill" style="width:' + batPct + '%;background:' + batCol + '"></span></span></span></div>' +
    '<div class="row"><span class="label">通信</span><span>L' + (r.comm_level||'?') + '</span></div>' +
    '<div class="cmd-group">' +
    '<button class="btn btn-sm" onclick="sendCmd(\'' + r.id + '\',\'stand\')">起立</button>' +
    '<button class="btn btn-sm" onclick="sendCmd(\'' + r.id + '\',\'patrol\')">巡逻</button>' +
    '<button class="btn btn-sm" onclick="sendCmd(\'' + r.id + '\',\'stop\')">停止</button>' +
    '<button class="btn btn-sm btn-danger" onclick="sendCmd(\'' + r.id + '\',\'alert\')">急停</button>' +
    '</div></div>';
}

// ======================== 指令 ========================
async function sendCmd(robotId, cmd){
  const res = await api('/command', {
    method: 'POST',
    body: JSON.stringify({robot_id: robotId, command: cmd})
  });
  if(res.code === 200) addAlert({level:'info', message:'指令 ' + cmd + ' → ' + robotId, time: Date.now()/1000});
  loadDashboard();
}

// ======================== 机器人页面 ========================
async function loadRobots(){
  const root = $('robotGridFull');
  const data = await api('/robots');
  const robots = data.data || [];
  if(!robots.length){ root.innerHTML = '<div class="empty">暂无注册机器人</div>'; return; }
  // 获取完整状态
  const fullCards = [];
  for(const r of robots){
    try {
      const rd = await api('/robots/' + r.id);
      const st = rd.data?.status || {};
      fullCards.push({
        id: r.id, type: st.robot_type || r.id.includes('狗') ? 'dog' : 'drone',
        battery: st.battery, mode: st.mode, health: st.health,
        comm_level: st.communication_level, position: st.position,
        extra: st.extra || {},
        capabilities: rd.data?.capabilities || [],
      });
    } catch(e) { fullCards.push({id: r.id, type: 'dog', extra:{}}); }
  }
  root.innerHTML = fullCards.map(r => {
    const html = robotCardHTML(r);
    // 加详细行
    const pos = r.position ? '(' + (r.position[0]?.toFixed(1)||'?') + ', ' + (r.position[1]?.toFixed(1)||'?') + ')' : '未知';
    const caps = (r.capabilities||[]).join(', ');
    return html.replace('</div>', '<div class="row"><span class="label">位置</span><span>' + pos + '</span></div>' +
      (caps ? '<div class="row"><span class="label">能力</span><span>' + caps + '</span></div>' : '') +
      '</div>');
  }).join('');
}

// ======================== 巡逻 ========================
async function loadPatrol(){
  const res = await api('/patrol/status');
  const st = res.data || {};
  $('patrolStatus').textContent = st.patrol_running ? '&#9654; 运行中' : '&#9632; 空闲';

  const pts = await api('/patrol/points');
  const list = pts.data || [];
  const container = $('patrolList');
  if(!list.length){ container.innerHTML = '<div class="empty">无巡逻点，请添加</div>'; return; }
  container.innerHTML = list.map((p,i) =>
    '<div class="patrol-item"><span><b>' + (p.name||'点'+(i+1)) + '</b> (' + p.x + ', ' + p.y + ') yaw=' + p.yaw + '</span>' +
    '<button class="btn btn-sm btn-danger" onclick="patrolDel(' + i + ')">&#10005;</button></div>'
  ).join('');
}

async function patrolAdd(){
  const name = $('ptName').value;
  const x = parseFloat($('ptX').value);
  const y = parseFloat($('ptY').value);
  const yaw = parseFloat($('ptYaw').value) || 0;
  if(isNaN(x) || isNaN(y)) return alert('请输入坐标');
  await api('/patrol/points', {method:'POST', body:JSON.stringify({x,y,yaw,name})});
  $('ptName').value = ''; $('ptX').value = ''; $('ptY').value = '';
  loadPatrol();
}

async function patrolDel(index){
  await api('/patrol/points/' + index, {method:'DELETE'});
  loadPatrol();
}

async function patrolStart(){
  await api('/patrol/start', {method:'POST'});
  loadPatrol();
  addAlert({level:'info', message:'巡逻已启动', time: Date.now()/1000});
}

async function patrolStop(){
  await api('/patrol/stop', {method:'POST'});
  loadPatrol();
  addAlert({level:'info', message:'巡逻已停止', time: Date.now()/1000});
}

// ======================== 历史 ========================
async function loadHistory(type){
  const tbody = $('histBody');
  try {
    let data;
    if(type === 'tasks'){
      data = await api('/history/tasks?limit=100');
      const rows = data.data || [];
      $('histTable').querySelector('thead tr').innerHTML = '<th>时间</th><th>机器人</th><th>类型</th><th>来源</th><th>结果</th>';
      tbody.innerHTML = rows.map(r => '<tr><td>' + new Date((r.created_at||0)*1000).toLocaleString() + '</td><td>' + (r.robot_id||'') + '</td><td>' + (r.type||'') + '</td><td>' + (r.source||'') + '</td><td>' + (r.success ? '&#10004;' : '&#10008;') + ' ' + (r.message||'') + '</td></tr>').join('') || '<tr><td colspan="5"><div class="empty">暂无记录</div></td></tr>';
    } else {
      data = await api('/history/robots?limit=100');
      const rows = data.data || [];
      $('histTable').querySelector('thead tr').innerHTML = '<th>时间</th><th>机器人</th><th>类型</th><th>电量</th><th>模式</th><th>健康</th>';
      tbody.innerHTML = rows.map(r => '<tr><td>' + new Date((r.timestamp||0)*1000).toLocaleString() + '</td><td>' + (r.robot_id||'') + '</td><td>' + (r.robot_type||'') + '</td><td>' + Math.round((r.battery||0)*100) + '%</td><td>' + (r.mode||'') + '</td><td>' + (r.health||'') + '</td></tr>').join('') || '<tr><td colspan="6"><div class="empty">暂无记录</div></td></tr>';
    }
  } catch(e) { tbody.innerHTML = '<tr><td colspan="5"><div class="empty">加载失败</div></td></tr>'; }
}

// ======================== 自动刷新 ========================
loadDashboard();
// 每 3 秒刷新仪表盘
setInterval(() => {
  const active = document.querySelector('.content.active');
  if(active && active.id === 'page_dashboard') loadDashboard();
}, 3000);

</script>
</body>
</html>
