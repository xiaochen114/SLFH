# 森林防火巡逻点配置
# 坐标系: 地图坐标系 (map frame)
# 单位: 米, 弧度
# 机器狗按序循环访问

patrol_points:
  # 示例点 - 请根据实际建图坐标修改
  # - {x: 0.0, y: 0.0, yaw: 0.0, name: "起点"}
  # - {x: 5.0, y: 0.0, yaw: 0.0, name: "东瞭望点"}
  # - {x: 5.0, y: 5.0, yaw: 1.57, name: "东北角"}
  # - {x: 0.0, y: 5.0, yaw: 3.14, name: "西北角"}
  # - {x: -5.0, y: 0.0, yaw: 0.0, name: "西瞭望点"}

# 每个点到达后停留时间 (秒)
dwell_time: 5

# 导航超时 (秒), 超过此时间未到达则跳过
nav_timeout: 120

# 遇障跳过策略: skip=跳过此点去下一个, retry=等待N秒重试
obstacle_policy: skip

# 循环模式: loop=无限循环, once=跑一遍就停
mode: loop
